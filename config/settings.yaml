# Almond — AI Deployment Sentinel (RLM Architecture)
#
# API Keys and Model definitions.
# Person 2 configures the LLM settings here.

llm:
  # Root model — runs the main RLM loop
  root_model: "gpt-4"
  # Sub model — used for quick sub-queries (cheaper/faster)
  sub_model: "gpt-3.5-turbo"
  # Maximum recursion depth before forcing an answer
  max_depth: 5
  # Temperature for code generation (lower = more deterministic)
  temperature: 0.1

vault:
  # Path to the Memory Vault directory
  path: "./vault"

repl:
  # Timeout for sandboxed code execution (seconds)
  timeout: 30
  # Maximum output length from a single execution (characters)
  max_output: 50000

cli:
  # Enable colored terminal output
  color: true
  # Show the full thought trace during analysis
  show_trace: true
